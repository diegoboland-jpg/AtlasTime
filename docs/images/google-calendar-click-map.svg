<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Google Cloud click map for AtlasTime Calendar setup</title>
  <desc id="desc">Three numbered Google Cloud panels show where to enable the Calendar API, configure the Google Auth Platform, and create the Web OAuth client.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17335e" flood-opacity=".14"/>
    </filter>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#12284d}.subtitle{font:16px Arial,sans-serif;fill:#61708a}
      .panel-title{font:700 19px Arial,sans-serif;fill:#182d50}.label{font:15px Arial,sans-serif;fill:#42516b}
      .small{font:13px Arial,sans-serif;fill:#687791}.button{font:700 14px Arial,sans-serif;fill:#fff}
      .number{font:700 18px Arial,sans-serif;fill:#fff}.arrow{stroke:#246bfd;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#246bfd"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#f4f7fc"/>
  <text x="60" y="62" class="title">AtlasTime · Google Calendar setup click map</text>
  <text x="60" y="92" class="subtitle">Use the numbered blue controls in Google Cloud Console, in this order.</text>

  <g transform="translate(55 130)" filter="url(#shadow)">
    <rect width="340" height="500" rx="22" fill="#fff"/>
    <rect width="340" height="62" rx="22" fill="#eaf1ff"/><rect y="42" width="340" height="20" fill="#eaf1ff"/>
    <circle cx="32" cy="31" r="18" fill="#246bfd"/><text x="27" y="37" class="number">1</text>
    <text x="62" y="37" class="panel-title">Enable Calendar API</text>
    <rect x="20" y="82" width="82" height="388" rx="12" fill="#f5f7fb"/>
    <text x="32" y="116" class="small">Menu</text><text x="32" y="157" class="label">APIs &amp;</text><text x="32" y="178" class="label">Services</text>
    <rect x="122" y="84" width="198" height="42" rx="10" fill="#eef3fb"/><text x="140" y="111" class="label">API Library</text>
    <rect x="122" y="148" width="198" height="48" rx="12" fill="#fff" stroke="#cbd6e7"/><text x="140" y="178" class="small">Search APIs and services</text>
    <text x="132" y="232" class="label">Google Calendar API</text>
    <rect x="132" y="258" width="106" height="42" rx="9" fill="#246bfd"/><text x="156" y="284" class="button">ENABLE</text>
    <path d="M294 175 C330 196 318 267 250 277" class="arrow"/>
    <text x="122" y="340" class="small">Click path:</text>
    <text x="122" y="367" class="label">☰ → APIs &amp; Services</text>
    <text x="122" y="394" class="label">→ Library → search</text>
    <text x="122" y="421" class="label">→ Google Calendar API</text>
    <text x="122" y="448" class="label">→ Enable</text>
  </g>

  <g transform="translate(430 130)" filter="url(#shadow)">
    <rect width="340" height="500" rx="22" fill="#fff"/>
    <rect width="340" height="62" rx="22" fill="#e8f8f1"/><rect y="42" width="340" height="20" fill="#e8f8f1"/>
    <circle cx="32" cy="31" r="18" fill="#16845b"/><text x="27" y="37" class="number">2</text>
    <text x="62" y="37" class="panel-title">Configure Google Auth</text>
    <rect x="20" y="82" width="104" height="388" rx="12" fill="#f5f7fb"/>
    <text x="34" y="119" class="small">Google Auth</text>
    <rect x="28" y="140" width="88" height="34" rx="8" fill="#dff6eb"/><text x="42" y="162" class="label">Branding</text>
    <text x="42" y="205" class="label">Audience</text>
    <text x="42" y="247" class="label">Data Access</text>
    <text x="42" y="289" class="label">Clients</text>
    <text x="144" y="114" class="panel-title">Audience</text>
    <text x="144" y="143" class="label">External · Testing</text>
    <rect x="144" y="162" width="154" height="42" rx="9" fill="#246bfd"/><text x="164" y="188" class="button">ADD TEST USERS</text>
    <text x="144" y="246" class="panel-title">Data Access</text>
    <rect x="144" y="266" width="166" height="42" rx="9" fill="#246bfd"/><text x="159" y="292" class="button">ADD OR REMOVE</text>
    <text x="144" y="334" class="small">Add exactly:</text>
    <text x="144" y="360" class="label">calendar.events.owned</text>
    <text x="144" y="409" class="small">Add your Google account</text>
    <text x="144" y="433" class="small">as a test user before</text>
    <text x="144" y="457" class="small">trying AtlasTime.</text>
  </g>

  <g transform="translate(805 130)" filter="url(#shadow)">
    <rect width="340" height="500" rx="22" fill="#fff"/>
    <rect width="340" height="62" rx="22" fill="#fff3df"/><rect y="42" width="340" height="20" fill="#fff3df"/>
    <circle cx="32" cy="31" r="18" fill="#d28116"/><text x="27" y="37" class="number">3</text>
    <text x="62" y="37" class="panel-title">Create Web client</text>
    <text x="26" y="103" class="small">Google Auth Platform → Clients</text>
    <rect x="26" y="124" width="132" height="42" rx="9" fill="#246bfd"/><text x="46" y="150" class="button">CREATE CLIENT</text>
    <text x="26" y="207" class="label">Application type</text>
    <rect x="26" y="219" width="288" height="42" rx="9" fill="#fff" stroke="#cbd6e7"/><text x="42" y="246" class="label">Web application⌄</text>
    <text x="26" y="296" class="label">Authorized JavaScript origin</text>
    <rect x="26" y="310" width="288" height="42" rx="9" fill="#f6f8fb"/><text x="42" y="337" class="small">http://localhost:4173</text>
    <text x="26" y="386" class="label">Authorized redirect URI</text>
    <rect x="26" y="400" width="288" height="55" rx="9" fill="#f6f8fb"/>
    <text x="42" y="424" class="small">http://localhost:4173/api/</text>
    <text x="42" y="443" class="small">google-calendar/callback</text>
    <rect x="214" y="470" width="100" height="42" rx="9" fill="#246bfd"/><text x="239" y="496" class="button">CREATE</text>
  </g>
  <text x="60" y="680" class="subtitle">Keep the Client secret private. Put it only in AtlasTime’s local .env file or a deployment secret manager.</text>
</svg>
