<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de clics para preparar AtlasTime en Render</title>
  <desc id="desc">Cuatro paneles muestran la creacion del Blueprint, la seleccion del repositorio, la entrada de la clave y la comprobacion de salud.</desc>
  <defs>
    <style>
      .bg{fill:#f4f7fb}.card{fill:#fff;stroke:#cfd9e8;stroke-width:2}.top{fill:#111827}.title{font:700 28px Arial,sans-serif;fill:#10213d}.body{font:18px Arial,sans-serif;fill:#52627a}.label{font:700 17px Arial,sans-serif;fill:#fff}.button{fill:#246bfd}.number{fill:#246bfd}.num{font:700 25px Arial,sans-serif;fill:#fff;text-anchor:middle}.arrow{stroke:#246bfd;stroke-width:5;fill:none;marker-end:url(#head)}
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#246bfd"/></marker>
  </defs>
  <rect class="bg" width="1200" height="760" rx="28"/>
  <text x="54" y="58" class="title">AtlasTime en Render: donde hacer clic</text>
  <text x="54" y="90" class="body">No pegues secretos en capturas, GitHub o mensajes.</text>

  <g transform="translate(55 130)">
    <rect class="card" width="500" height="230" rx="20"/>
    <rect class="top" width="500" height="52" rx="20"/><rect class="top" y="30" width="500" height="22"/>
    <circle class="number" cx="38" cy="26" r="22"/><text class="num" x="38" y="35">1</text>
    <text class="label" x="76" y="33">Panel de Render</text>
    <text class="title" x="30" y="100">New +  &gt;  Blueprint</text>
    <text class="body" x="30" y="137">Conecta GitHub si Render lo solicita.</text>
    <rect class="button" x="30" y="164" width="190" height="46" rx="12"/><text class="label" x="61" y="194">New Blueprint</text>
  </g>

  <g transform="translate(645 130)">
    <rect class="card" width="500" height="230" rx="20"/>
    <rect class="top" width="500" height="52" rx="20"/><rect class="top" y="30" width="500" height="22"/>
    <circle class="number" cx="38" cy="26" r="22"/><text class="num" x="38" y="35">2</text>
    <text class="label" x="76" y="33">Seleccionar repositorio</text>
    <text class="title" x="30" y="100">diegoboland-jpg / AtlasTime</text>
    <text class="body" x="30" y="137">Render detecta render.yaml.</text>
    <rect x="30" y="160" width="440" height="50" rx="10" fill="#edf3ff" stroke="#a9c2ff"/>
    <text class="body" x="50" y="192">Servicio: atlastime-staging</text>
  </g>

  <path class="arrow" d="M555 245 C590 245 610 245 640 245"/>

  <g transform="translate(55 455)">
    <rect class="card" width="500" height="230" rx="20"/>
    <rect class="top" width="500" height="52" rx="20"/><rect class="top" y="30" width="500" height="22"/>
    <circle class="number" cx="38" cy="26" r="22"/><text class="num" x="38" y="35">3</text>
    <text class="label" x="76" y="33">Clave obligatoria</text>
    <text class="title" x="30" y="98">Pegar la nueva clave de datos</text>
    <text class="body" x="30" y="135">ATLASTIME_DATA_ENCRYPTION_KEY</text>
    <rect x="30" y="155" width="440" height="44" rx="9" fill="#f8fafc" stroke="#cfd9e8"/>
    <text class="body" x="48" y="184">••••••••••••••••••••••••••••</text>
    <text class="body" x="30" y="220">Revisar costo y pulsar Apply.</text>
  </g>

  <g transform="translate(645 455)">
    <rect class="card" width="500" height="230" rx="20"/>
    <rect class="top" width="500" height="52" rx="20"/><rect class="top" y="30" width="500" height="22"/>
    <circle class="number" cx="38" cy="26" r="22"/><text class="num" x="38" y="35">4</text>
    <text class="label" x="76" y="33">Confirmar despliegue</text>
    <text class="title" x="30" y="98">Abrir la URL del servicio</text>
    <text class="body" x="30" y="135">Agregar /api/health a la direccion.</text>
    <rect x="30" y="155" width="440" height="44" rx="9" fill="#e9f8ef" stroke="#9ed5b2"/>
    <text x="48" y="184" style="font:700 18px Arial,sans-serif;fill:#187044">status: ok  |  storage: encrypted</text>
    <text class="body" x="30" y="220">Luego configurar Google y Microsoft.</text>
  </g>

  <path class="arrow" d="M305 365 C305 400 305 420 305 450"/>
  <path class="arrow" d="M555 570 C590 570 610 570 640 570"/>
</svg>
