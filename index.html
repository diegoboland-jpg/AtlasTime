<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D1B2A" />
    <meta name="description" content="Kikiroo helps people find a humane time to connect across time zones." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/kikiroo-icon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kikiroo" />
    <title>Kikiroo — Time. Anywhere. Together.</title>
    <style>
      :root{--kik-midnight:#0D1B2A;--kik-teal:#00B4A8;--kik-aqua:#22D3EE;--kik-sunrise:#FF9F1C;--kik-coral:#EF4444;--kik-violet:#8B5CF6;--kik-cloud:#F1F5F9}
      body{background:linear-gradient(180deg,#fff 0%,#f8fafc 52%,#f1f5f9 100%)}
      .brand{color:var(--kik-midnight)}
      .brand-mark{width:46px!important;height:46px!important;border-radius:15px!important;background:var(--kik-midnight) url('/icons/kikiroo-icon.svg') center/cover no-repeat!important;box-shadow:0 10px 28px rgba(13,27,42,.18)!important}
      .brand-mark svg{display:none}
      .brand>span:last-child{font-size:0}.brand>span:last-child:after{content:'Kikiroo';font-size:20px}
      .mvp-badge{color:#087C75!important;background:#E6F8F6!important}
      .hero{background:linear-gradient(135deg,#0D1B2A 0%,#123A49 58%,#095C58 100%)!important;box-shadow:0 28px 70px rgba(13,27,42,.18)!important}
      .hero .eyebrow{color:#72F1E7!important}.section-kicker{color:var(--kik-teal)!important}
      .primary-button,.pwa-update-action{background:var(--kik-teal)!important;color:#fff!important}.primary-button:hover,.pwa-update-action:hover{background:#078B84!important}
      .status.online{color:#087C75!important;background:#E6F8F6!important}.working{background:#EAF9F7!important}.selected{box-shadow:inset 0 0 0 2px var(--kik-sunrise)!important}
      :focus-visible{outline-color:var(--kik-sunrise)!important}
      footer span:first-child{font-size:0}footer span:first-child:after{content:'Kikiroo v1.11';font-size:inherit}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
